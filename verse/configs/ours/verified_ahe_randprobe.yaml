# Ablation of verified_ahe: a seeded random policy, not the optimizer, spends the same
# verification budget (replay and ablate on random failed tasks and steps, then fix_probe of
# the submitted draft on random failed tasks). The optimizer sees only the results.
name: verified_ahe_randprobe
evidence: {kind: push_digest_layered, max_tasks: 12}
probes: {kind: t2t_probes, budget: 8, budget_s: 3600}
probe_scheduler: {kind: random, seed: 0}
attribute: {max_fail: 6, max_success: 2, wall_s: 2400}
edit_space: {kind: code_hooks}
