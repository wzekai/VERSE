# Terminal-Bench variant of self_teacher/verse_ahe.yaml: same method, TB seed prompt,
# and the smaller attribution budget of tb/tb_verified_ahe.yaml.
base_prompt: TB
name: tb_verse_ahe
evidence: {kind: push_digest_layered, max_tasks: 12}
probes: {kind: t2t_probes, budget: 8, budget_s: 3600}
attribute: {max_fail: 4, max_success: 2, wall_s: 1800}
edit_space: {kind: code_hooks}
meta_teacher:
  self_edit: true
  seed_wisdom: true
  episode_budget: 8
  episode_wall_s: 3600
  meta_max_turns: 30
  meta_bash_cap: 30
